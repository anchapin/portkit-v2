[project]
name = "portkit"
version = "0.1.0"
description = "Java -> Bedrock conversion engine: deterministic core, LLM only for the residue."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
portkit = "portkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# Vendored Bedrock JSON schemas the validator reads at runtime (#15).
"portkit.validate" = ["schemas/*/LICENSE", "schemas/*.md", "schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realmods: needs the real-mod corpus jars in the cache (portkit corpus fetch); skipped when absent"]
