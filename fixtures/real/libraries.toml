# Mantle pinned 2026-10-21 (#355, pending Alex): Tinkers' Construct registers
# its blocks through Mantle's deferred registers (BlockDeferredRegisterExtension,
# returning Mantle ItemObjects) and builds most of them on Mantle base classes
# (its TableBlock extends Mantle's InventoryBlock), so without Mantle's classes
# the registration reader reads none of its casting basins, tables, fluid
# cannons or controllers (corpus 3.12.1.231: 0 of 435 blockstate
# registrations read; with 1.11.117: 397, every one read alone is read with
# it). 1.11.117 is the only Modrinth Forge 1.20.1 version satisfying the
# corpus jar's [1.11.113,) (its META-INF/mods.toml); Modrinth marks it beta.
# The gauntlet jar 3.11.2.166 asks [1.11.97,), which it satisfies too.
[[library]]
name = "mantle"
for = ["tinkers_construct"]
project = "mantle"
version_id = "37ccXi7G"
version = "1.11.117"
