# Dependency jars a corpus or gauntlet mod is converted with, read-only (#280,
# src/portkit/libraries.py). A library's classes are visible to the bytecode
# readers (base classes, registering constructors); nothing of it is converted
# or shipped. Jars are downloaded and sha512-checked like the corpus jars,
# measured and discarded, never committed.
#
# Hand-pinned, one entry per library jar; `for` names the manifest mods
# (fixtures/real/mods.toml, fixtures/real/gauntlet.toml) it is read with. Rule
# (DEFAULT, #280 pick 2a): the newest Modrinth release of the library on the
# mod's loader and game version that satisfies the mod's own declared range,
# pinned only when measured to change what the readers find.
#
# Measured 2026-10-17: BCLib 21.800.2, WorldWeaver 21.800.2 (with its 19
# nested wover jars) and WunderLib 21.800.2 for BetterEnd 21.800.2 read 0 of
# BetterEnd's 722 blockstate registrations (as without them); on 2026-10-18
# (#280, lazy-initialisation guards read) 21.800.3 read 16 of 722 against 86
# alone, so they weren't pinned then. Pinned 2026-10-18 (#280 PR "WorldWeaver
# builders", pick 5a: pinned once the reading is at least the no-library
# baseline): with System.getProperty of a property nothing defines read as
# null (pick 1a), java.util lists, iterators and streams modelled (pick 2a)
# and a library call the registration run can't follow taken as havoc
# (pick 4a), BetterEnd reads 199 of 722 with them (86 alone; every block read
# alone is read with them, as the same class).
#
# Fabric API pinned 2026-10-19 (#280, "Fabric API BlockSetType"): with
# 0.136.1+1.21.8 BetterEnd's set types are read (WorldWeaver's BlockSet,
# MetalBlockSet and WoodenBlockSet build them with Fabric API's
# BlockSetTypeBuilder.copyOf(BlockSetType.STONE / IRON / OAK)...register(id)),
# so its 19 plates read what presses them and their clicks; without it the
# builder isn't there and they read as an unknown set type. The blockstates
# whose registration is read are the same with it (every block read alone is
# read with it, as the same class). Its 43 module jars are nested under
# META-INF/jars/ and read with it.

