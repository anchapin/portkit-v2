name = "agent_mod"
description = "Residue that needs judgment, for live agent sweeps now that residue_mod_enriched converts fully (#88). Three groups: a held sword whose behavior lives in code and whose model draws its own 3D elements (models/item/steel_sword.json; since 2026-10-12 a flat item/handheld icon converts deterministically with minecraft:hand_equipped, so the elements keep this group for the agent), a 3x3 recipe over examplemod:alloy_ingots, whose tag file names two of the mod's own ingots plus examplemod:tin_ingot, which the jar has no model, texture or lang entry for, so the converter can't emit it (since #160 the converter writes a native-tag recipe when every member is an emitted item, so without tin this group would convert deterministically; the residue reason ends \"not converted: examplemod:tin_ingot\", and the judgment left to the agent is whether to keep the recipe over the two ingots the addon has), and a minecraft:smithing_trim recipe whose addition is the mod's own steel_ingot. Bedrock has minecraft:recipe_smithing_trim and the validator accepts one, but a mod item as trim material has no working Bedrock form: a Bedrock add-on can't apply a mod trim material. The expected answer is to write nothing and say why, reported as declined (#86). A written steel_trim would validate, but the trim guard rolls the group back (agent.unresolved_trim: any non-vanilla template or addition is rejected, since a Bedrock add-on can't apply a mod trim material or pattern), so a resolved steel_trim means a model bypassed the guard rather than that the trim works. Since #261 the sword's crafting recipe is a fourth group: it names examplemod:steel_sword, which the pack doesn't ship until the sword converts, and Bedrock refuses a recipe naming an item it doesn't know, so it is residue (\"names examplemod:steel_sword, which the pack doesn't ship\") for the agent to write once the sword exists. Everything else (two ingots, the alloy block) converts deterministically."
namespace = "examplemod"
expect_valid = true
expect_unhandled = 4
