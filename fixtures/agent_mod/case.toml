name = "agent_mod"
description = "Residue that needs judgment, for live agent sweeps now that residue_mod_enriched converts fully (#88). Three groups: a held sword whose behavior lives in code (models/item/steel_sword.json), a 3x3 recipe over examplemod:alloy_ingots, a tag file naming two of the mod's own ingots, and a minecraft:smithing_trim recipe whose addition is the mod's own steel_ingot. Bedrock has minecraft:recipe_smithing_trim and the validator accepts one, but a mod item as trim material has no working Bedrock form, and the mod ships no trim_material definition, which Java needs before the recipe applies anything. The expected answer is to write nothing and say why, reported as declined (#86). A written steel_trim would validate, but the trim guard rolls the group back (agent.unresolved_trim: addition names a non-vanilla trim material with no data/<ns>/trim_material/<id>.json), so a resolved steel_trim means a model bypassed the guard rather than that the trim works. Everything else (two ingots, the alloy block, the sword's crafting recipe) converts deterministically."
namespace = "examplemod"
expect_valid = true
expect_unhandled = 3
