name: real-mods

# The real-mod corpus (#21). Jars are pinned in fixtures/real/mods.toml and
# downloaded here, never committed. Nightly and on demand; the PR gate stays
# the hand-built fixtures in ci.yml until this job has been stable a while.
# The nightly run covers the default set; mods marked `optional = true` in the
# manifest (Tinkers' Construct, Alex's Mobs, Mekanism) run only when a manual
# dispatch asks for them.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      include_optional:
        description: "Also fetch and evaluate the optional mods (Tinkers' Construct, Alex's Mobs, Mekanism)"
        type: boolean
        default: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    env:
      PORTKIT_CORPUS_CACHE: ${{ github.workspace }}/.corpus-cache
      # Mojang's vanilla sound list (#124) and the loader and vanilla item tags
      # (#160), fetched rather than committed. The corpus baseline is measured
      # with them, so vanilla sound refs survive and shared tags resolve.
      PORTKIT_REFERENCE_CACHE: ${{ github.workspace }}/.reference-cache
      # Empty on the nightly schedule, so only the default set runs.
      OPTIONAL_FLAG: ${{ inputs.include_optional && '--include-optional' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: real-mods-${{ inputs.include_optional && 'all' || 'default' }}-${{ hashFiles('fixtures/real/mods.toml', 'fixtures/real/libraries.toml') }}
          restore-keys: |
            real-mods-${{ inputs.include_optional && 'all' || 'default' }}-

      - name: Fetch pinned jars (sha512-checked)
        run: portkit corpus fetch $OPTIONAL_FLAG

      # The pins live in src/portkit/data/__init__.py (sound list) and
      # src/portkit/data/tags.py (loader and vanilla item tags, #160).
      - uses: actions/cache@v4
        with:
          path: .reference-cache
          key: reference-${{ hashFiles('src/portkit/data/__init__.py', 'src/portkit/data/tags.py', 'src/portkit/data/mappings.py', 'src/portkit/data/models.py') }}

      - name: Fetch reference data (vanilla sound list, loader and vanilla item tags; sha256-checked)
        run: portkit reference fetch

      # Mojang's Minecraft Creator Tools as a second, report-only oracle (#113).
      # Pinned so a new mct release can't move the numbers unannounced.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Report-only: if the install breaks, eval --mct skips with a note
      # instead of failing the corpus gate.
      - name: Install Minecraft Creator Tools (mct)
        continue-on-error: true
        run: |
          npm install -g @minecraft/creator-tools@0.20.0
          mct eula --accept
          mct --version

      - name: Corpus coverage (fails on regression against fixtures/real/coverage-baseline.json; mct findings are report-only)
        run: portkit eval --corpus $OPTIONAL_FLAG --mct --json corpus-eval.json

      - name: Upload corpus eval (coverage rows + mct findings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-eval
          path: corpus-eval.json
          if-no-files-found: ignore

      - name: Corpus tests
        run: pytest -q -m realmods
