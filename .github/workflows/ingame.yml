name: ingame

# In-game checks (#238): convert a few corpus and deco packs, install each with
# a generated check behavior pack on Mojang's Bedrock Dedicated Server, and run
# the Script API checks headlessly (every block places, every item spawns,
# container slot counts #226, connection states #221, wired block drops #299, per-tool drops of match_tool tables #299, doors and two-tall blocks #296, trapdoors opened and closed by redstone and broken for one drop #296, pressure plates pressed by an armor stand and a stick, powering a lamp and released after the re-check #296, ore features placed and generated #281, the Overworld's in a generated-world run, geode features generated #281). A run fails on a failed
# check or a content-log error; the server output, content log and report are
# uploaded per pack.
#
# The server is downloaded from minecraft.net here, sha256-checked against the
# pin in src/portkit/ingame/server.py, and never cached, committed or uploaded.
# Downloading it means agreeing to the Minecraft EULA and the Microsoft Privacy
# Statement; `--accept-eula` below is that agreement (docs/decisions.md,
# 2026-10-15, #238). Manual dispatch only, report-only: not a PR gate.
on:
  workflow_dispatch:

jobs:
  ingame:
    # BDS ships for x86-64 Linux and needs Ubuntu 22.04 or later.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: farmers_delight_neoforge, manifest: fixtures/real/mods.toml }
          - { name: waystones, manifest: fixtures/real/mods.toml }
          - { name: supplementaries, manifest: fixtures/real/mods.toml }
          - { name: cluttered, manifest: fixtures/ingame/mods.toml }
          - { name: night_lights, manifest: fixtures/ingame/mods.toml }
          - { name: cluttered, manifest: fixtures/ingame/mods.toml, experiment: upcoming_creator_features }
          # Wearable mod armor with worn-look attachables (#274). BDS loads the items; it doesn't draw them.
          - { name: mythicmetals, manifest: fixtures/real/mods.toml }
          # Blocks whose drops the loot converter wired with minecraft:loot (#299): each is broken and its drop counted.
          - { name: botania, manifest: fixtures/real/gauntlet.toml }
          # Crafting recipes written with a bare type ("crafting_shaped"), read as minecraft: since #302.
          - { name: biomes_o_plenty, manifest: fixtures/real/gauntlet.toml }
          # Tool-gated drops (#299: tier match_tool on sky stone, budding quartz tables): checked per tool.
          - { name: ae2, manifest: fixtures/real/gauntlet.toml }
          # Smithing recipes whose addition is a block, tagged on its item form (#305: the copper backtank).
          - { name: create, manifest: fixtures/real/mods.toml }
          # Recipes written once per combination of a vanilla-only tag over several slots (#302 pick 1: blastbrick, c:bricks x4).
          - { name: immersive_engineering, manifest: fixtures/real/gauntlet.toml }
          # Vertical slabs on block_face + cardinal_direction permutations, one uvlocked bone per side (#296).
          - { name: quark, manifest: fixtures/real/gauntlet.toml }
          # The gauntlet's NeoForge Waystones build, converted by the same adapter as the Fabric one (#296).
          - { name: waystones, manifest: fixtures/real/gauntlet.toml, label: waystones-neoforge }
          # Ores from Forge biome modifiers (#281): each ore feature placed by script, and the nether checked for the ore it generates.
          - { name: tinkers_construct, manifest: fixtures/real/gauntlet.toml, label: tinkers-gauntlet }
          # Fabric ores attached in code (#281 pick 5a), read from the bytecode: a generated world (ore checks only), so the Overworld's ores are counted in fresh chunks as well as the Nether's and the End's.
          - { name: mythicmetals, manifest: fixtures/real/mods.toml, label: mythicmetals-worldgen, world: default }
          # Geodes from Forge biome modifiers (#281 slice 3): a generated world, where a test-only copy of each geode rule places the converted geode feature in every chunk and fresh Overworld chunks are scanned for its crystal blocks.
          - { name: tinkers_construct, manifest: fixtures/real/gauntlet.toml, label: tinkers-worldgen, world: default }
          # Pressure plates (#296): BetterEnd's ten wooden plates (DEFAULT from the jar's wooden_pressure_plates tag; its stone and metal plates stay residue).
          - { name: betterend, manifest: fixtures/real/mods.toml }
    # `label` names a run whose jar shares its fixture name with another (one mod, two loader builds).
    name: ${{ matrix.label || matrix.name }}${{ matrix.experiment && format(' ({0})', matrix.experiment) || '' }}
    env:
      PORTKIT_CORPUS_CACHE: ${{ github.workspace }}/.corpus-cache
      PORTKIT_REFERENCE_CACHE: ${{ github.workspace }}/.reference-cache
      RUN_NAME: ${{ matrix.label || matrix.name }}${{ matrix.experiment && '-experiment' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch the pack's jar (sha512-checked)
        run: portkit corpus fetch --manifest ${{ matrix.manifest }} --fixture ${{ matrix.name }}

      - uses: actions/cache@v4
        with:
          path: .reference-cache
          key: reference-${{ hashFiles('src/portkit/data/__init__.py', 'src/portkit/data/tags.py', 'src/portkit/data/mappings.py', 'src/portkit/data/models.py') }}

      - name: Fetch reference data (sha256-checked)
        run: portkit reference fetch

      - name: Convert
        run: |
          jar=$(ls "$PORTKIT_CORPUS_CACHE"/${{ matrix.name }}-*.jar)
          # The mod's pinned dependency jars (fixtures/real/libraries.toml, #280), read-only.
          libs=$(python -c "from portkit import corpus, libraries; print(' '.join('--library ' + str(corpus.cached(l)) for l in libraries.for_mod('${{ matrix.name }}', libraries.load()) if corpus.cached(l)))")
          portkit convert "$jar" "tree/$RUN_NAME" --no-addon $libs ${{ matrix.experiment && format('--experiment {0}', matrix.experiment) || '' }}

      - name: Fetch Bedrock Dedicated Server (pinned, sha256-checked; agrees to the Minecraft EULA)
        run: portkit ingame fetch-server --dir "$RUNNER_TEMP/bds" --accept-eula

      - name: In-game checks
        run: |
          portkit ingame run --server "$RUNNER_TEMP/bds" --tree "tree/$RUN_NAME" --name "$RUN_NAME" \
            --out "ingame/$RUN_NAME" --work "$RUNNER_TEMP/run" \
            ${{ matrix.experiment && format('--experiment {0}', matrix.experiment) || '' }} \
            ${{ matrix.world && format('--world {0}', matrix.world) || '' }}

      # The report, the server's output and its content log: never the server.
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-${{ env.RUN_NAME }}
          path: ingame/${{ env.RUN_NAME }}
          if-no-files-found: ignore
